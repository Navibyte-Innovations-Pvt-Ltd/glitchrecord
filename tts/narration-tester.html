<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Narration Tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f12; color: #e7e7ea; padding: 18px;
      display: flex; flex-direction: column; gap: 12px; height: 100vh;
    }
    h1 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; }
    p.hint { font-size: 11px; color: #8a8a92; line-height: 1.5; }
    textarea {
      flex: 1; min-height: 120px; resize: none; width: 100%;
      background: #18181c; border: 1px solid #2a2a30; border-radius: 8px;
      color: #e7e7ea; padding: 10px; font-size: 13px; line-height: 1.55; outline: none;
    }
    textarea:focus { border-color: #3b82f6; }
    .row { display: flex; gap: 8px; align-items: center; }
    select, button {
      font-size: 12px; border-radius: 7px; border: 1px solid #2a2a30;
      background: #18181c; color: #e7e7ea; padding: 7px 10px; cursor: pointer;
    }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; flex: 1; }
    button.primary:hover { background: #1d4ed8; }
    button.primary:disabled { opacity: 0.45; cursor: default; }
    #status { font-size: 12px; color: #9aa0aa; min-height: 16px; }
    #err { font-size: 11px; color: #f87171; background: #2a1414; border-radius: 6px;
      padding: 8px; max-height: 90px; overflow: auto; white-space: pre-wrap; display: none; }
    audio { width: 100%; display: none; }
    .reveal { font-size: 11px; color: #8a8a92; text-decoration: underline; cursor: pointer; display: none; }
  </style>
</head>
<body>
  <h1><span class="dot"></span> Narration Tester</h1>
  <p class="hint">Paste a script → pick model/voice → Generate → hear the audio. No recording needed. Runs locally on your Mac.</p>
  <textarea id="script" placeholder="Paste your script here… e.g. Toh basically, GlitchGrab ek AI bug tracker hai."></textarea>
  <input id="apikey" type="password" placeholder="Sarvam API key (only for Sarvam — get from dashboard.sarvam.ai)"
    style="width:100%;background:#18181c;border:1px solid #2a2a30;border-radius:7px;color:#e7e7ea;padding:7px 10px;font-size:12px;outline:none;" />
  <div class="row" style="flex-wrap: wrap;">
    <select id="engine" title="Model">
      <option value="sarvam" selected>Sarvam AI (cloud, native Hinglish)</option>
      <option value="supertonic">Supertonic (local, Hindi)</option>
      <option value="xtts">XTTS (local, Western)</option>
    </select>
    <select id="lang" title="Language">
      <option value="hi" selected>Hindi (hi)</option>
      <option value="en">Hinglish/English (en)</option>
    </select>
    <select id="voice" title="Voice"></select>
    <button id="gen" class="primary">✨ Generate audio</button>
  </div>
  <div id="status"></div>
  <div id="err"></div>
  <audio id="audio" controls></audio>
  <span id="reveal" class="reveal">Reveal file in Finder</span>

  <script>
    const $ = (id) => document.getElementById(id);
    const api = () => window.electronAPI;
    let lastPath = null;
    let timer = null, elapsed = 0;

    // Voices per engine.
    const VOICES = {
      sarvam: [["anushka","Anushka"],["manisha","Manisha"],["vidya","Vidya"],["arya","Arya"],["abhilash","Abhilash"],["karun","Karun"],["hitesh","Hitesh"]],
      supertonic: [["F1","F1 (female)"],["F2","F2 (female)"],["F3","F3 (female)"],["M1","M1 (male)"],["M2","M2 (male)"],["M3","M3 (male)"]],
      xtts: [["Ana Florence","Ana (F)"],["Daisy Studious","Daisy (F)"],["Andrew Chipper","Andrew (M)"],["Damien Black","Damien (M)"]],
    };
    function fillVoices() {
      const eng = $("engine").value;
      $("voice").innerHTML = VOICES[eng].map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
      $("apikey").style.display = eng === "sarvam" ? "block" : "none";
    }
    $("engine").addEventListener("change", fillVoices);
    fillVoices();

    $("gen").addEventListener("click", async () => {
      const text = $("script").value.trim();
      if (!text) return;
      const a = api();
      if (!a?.generateNarration) { $("err").style.display = "block"; $("err").textContent = "electronAPI not available"; return; }

      $("gen").disabled = true;
      $("err").style.display = "none"; $("err").textContent = "";
      $("audio").style.display = "none"; $("reveal").style.display = "none";

      // Status = current stage + elapsed seconds. Track stage in a var so the
      // ticker rebuilds the line cleanly (no appending).
      elapsed = 0;
      let stage = "Loading model…";
      const render = () => { $("status").textContent = stage + " · " + elapsed + "s"; };
      render();
      timer = setInterval(() => { elapsed++; render(); }, 1000);

      const unsub = a.onNarrationProgress ? a.onNarrationProgress((s) => { stage = s; render(); }) : null;

      try {
        const res = await a.generateNarration(text, { engine: $("engine").value, lang: $("lang").value, voice: $("voice").value, apiKey: $("apikey").value.trim() });
        if (res.ok && res.path) {
          lastPath = res.path;
          const m = a.getLocalMediaUrl ? await a.getLocalMediaUrl(res.path) : null;
          if (m && m.success) { $("audio").src = m.url; $("audio").style.display = "block"; $("audio").play().catch(() => {}); }
          $("reveal").style.display = "inline";
          $("status").textContent = "Done ✓ (" + elapsed + "s)";
        } else {
          $("err").style.display = "block"; $("err").textContent = res.error || "Generation failed";
          $("status").textContent = "";
        }
      } catch (e) {
        $("err").style.display = "block"; $("err").textContent = String(e);
        $("status").textContent = "";
      } finally {
        clearInterval(timer);
        $("gen").disabled = false;
        if (unsub) unsub();
      }
    });

    $("reveal").addEventListener("click", () => { if (lastPath) api()?.revealInFolder?.(lastPath); });
  </script>
</body>
</html>
